<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>CSHOP · 让算力在指尖折叠</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=118" />
  <link rel="stylesheet" href="css/cart.css?v=118" />
  <link rel="stylesheet" href="css/home.css?v=118" />
</head>
<body class="home" data-page="home">

  <!-- ============ SVG 素材：产品线稿（占位立体图） ============ -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="lg-silver" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#fbfcfd" />
        <stop offset="0.5" stop-color="#e4e8ee" />
        <stop offset="1" stop-color="#c3cad4" />
      </linearGradient>
      <linearGradient id="lg-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e7ebf0" />
        <stop offset="0.6" stop-color="#cfd5de" />
        <stop offset="1" stop-color="#aab2bd" />
      </linearGradient>
      <linearGradient id="lg-graphite" x1="0.1" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#5a616b" />
        <stop offset="0.45" stop-color="#31363d" />
        <stop offset="1" stop-color="#191c21" />
      </linearGradient>
      <linearGradient id="lg-screen-dark" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#39424f" />
        <stop offset="1" stop-color="#0c1015" />
      </linearGradient>
      <linearGradient id="lg-screen-blue" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#dfeaff" />
        <stop offset="0.55" stop-color="#a9c0e8" />
        <stop offset="1" stop-color="#7e97c9" />
      </linearGradient>
      <linearGradient id="lg-tablet-screen" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#e2ecfd" />
        <stop offset="0.55" stop-color="#a9bcdf" />
        <stop offset="1" stop-color="#8199c4" />
      </linearGradient>
      <linearGradient id="lg-glare" x1="0" y1="0" x2="0.75" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
        <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="lg-warm" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#fbf6ef" />
        <stop offset="1" stop-color="#e3d5c1" />
      </linearGradient>
    </defs>

    <symbol id="art-laptop" viewBox="0 0 320 220">
      <ellipse cx="160" cy="188" rx="114" ry="10" fill="#0b0d12" opacity=".09" />
      <path d="M48 146h224l14 20c1.8 2.6 0 5.4-3 5.4H37c-3 0-4.8-2.8-3-5.4z" fill="url(#lg-metal)" />
      <path d="M48 146h224l2.4 4.4H45.6z" fill="#fff" opacity=".55" />
      <rect x="139" y="155" width="42" height="4" rx="2" fill="#a8afb9" />
      <rect x="74" y="20" width="172" height="128" rx="11" fill="url(#lg-silver)" />
      <rect x="81" y="27" width="158" height="114" rx="5" fill="url(#lg-screen-dark)" />
      <rect x="81" y="27" width="158" height="114" rx="5" fill="url(#lg-screen-blue)" opacity=".18" />
      <rect x="81" y="27" width="158" height="114" rx="5" fill="url(#lg-glare)" />
      <rect x="74" y="143" width="172" height="5" fill="#b3bac4" />
    </symbol>

    <symbol id="art-phone" viewBox="0 0 320 220">
      <ellipse cx="160" cy="196" rx="60" ry="8" fill="#0b0d12" opacity=".08" />
      <g transform="rotate(-4 160 110)">
        <rect x="116" y="14" width="88" height="184" rx="22" fill="url(#lg-graphite)" />
        <rect x="121" y="19" width="78" height="174" rx="18" fill="#0b0d12" />
        <rect x="125" y="23" width="70" height="166" rx="15" fill="url(#lg-screen-blue)" />
        <path d="M125 23h70v54L125 103Z" fill="#fff" opacity=".16" />
        <rect x="147" y="28" width="26" height="7" rx="3.5" fill="#0b0d12" />
        <rect x="148" y="180" width="24" height="3" rx="1.5" fill="#0b0d12" opacity=".45" />
        <rect x="204" y="62" width="2.5" height="26" rx="1.2" fill="#6b727c" />
      </g>
    </symbol>

    <symbol id="art-tablet" viewBox="0 0 320 220">
      <ellipse cx="160" cy="196" rx="94" ry="10" fill="#0b0d12" opacity=".07" />
      <rect x="54" y="32" width="212" height="152" rx="16" fill="url(#lg-silver)" stroke="#a7b0bd" stroke-opacity=".4" />
      <rect x="62" y="40" width="196" height="136" rx="10" fill="url(#lg-tablet-screen)" />
      <rect x="62.5" y="40.5" width="195" height="135" rx="10" fill="none" stroke="#9aa6ba" stroke-opacity=".35" />
      <path d="M62 40h196v44L62 118Z" fill="#fff" opacity=".22" />
      <circle cx="160" cy="36" r="2.2" fill="#98a0aa" />
    </symbol>

    <symbol id="art-headphones" viewBox="0 0 320 220">
      <ellipse cx="160" cy="190" rx="86" ry="10" fill="#0b0d12" opacity=".07" />
      <path d="M74 138V96a86 86 0 0 1 172 0v42" fill="none" stroke="url(#lg-metal)" stroke-width="15" stroke-linecap="round" />
      <path d="M74 136V96a86 86 0 0 1 172 0v40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55" />
      <rect x="48" y="110" width="54" height="78" rx="23" fill="url(#lg-graphite)" />
      <rect x="218" y="110" width="54" height="78" rx="23" fill="url(#lg-graphite)" />
      <rect x="58" y="120" width="34" height="58" rx="17" fill="#0f1216" opacity=".55" />
      <rect x="228" y="120" width="34" height="58" rx="17" fill="#0f1216" opacity=".55" />
      <ellipse cx="75" cy="149" rx="12" ry="19" fill="#fff" opacity=".07" />
      <ellipse cx="245" cy="149" rx="12" ry="19" fill="#fff" opacity=".07" />
    </symbol>

    <symbol id="art-charger" viewBox="0 0 320 220">
      <ellipse cx="160" cy="180" rx="46" ry="7" fill="#0b0d12" opacity=".07" />
      <rect x="142" y="38" width="9" height="28" rx="3.5" fill="#cfd4db" />
      <rect x="169" y="38" width="9" height="28" rx="3.5" fill="#cfd4db" />
      <rect x="122" y="64" width="76" height="100" rx="18" fill="url(#lg-warm)" />
      <path d="M140 64h40a18 18 0 0 1 18 18v14h-76V82a18 18 0 0 1 18-18z" fill="#fff" opacity=".3" />
      <rect x="150" y="116" width="20" height="10" rx="5" fill="#b5a48c" opacity=".6" />
      <circle cx="160" cy="146" r="2.5" fill="#8fcfa2" />
    </symbol>

    <symbol id="art-powerbank" viewBox="0 0 320 220">
      <ellipse cx="160" cy="180" rx="62" ry="8" fill="#0b0d12" opacity=".08" />
      <rect x="106" y="42" width="108" height="130" rx="24" fill="url(#lg-graphite)" />
      <path d="M130 42h60a24 24 0 0 1 24 24v16h-108V66a24 24 0 0 1 24-24z" fill="#fff" opacity=".08" />
      <rect x="150" y="50" width="20" height="5" rx="2.5" fill="#0b0d12" opacity=".55" />
      <rect x="132" y="92" width="56" height="3" rx="1.5" fill="#fff" opacity=".18" />
      <circle cx="138" cy="145" r="3" fill="#8ee6b8" />
      <circle cx="154" cy="145" r="3" fill="#8ee6b8" />
      <circle cx="170" cy="145" r="3" fill="#8ee6b8" opacity=".25" />
    </symbol>

    <symbol id="art-bag" viewBox="0 0 24 24">
      <path d="M6.5 8h11l1 12h-13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M9.2 8V6.4a2.8 2.8 0 0 1 5.6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol>
  </svg>

  <!-- ==================== 顶部导航 ==================== -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <span class="nav__logo" aria-label="CSHOP">CSHOP</span>

      <nav class="nav__links" aria-label="商品分类" id="navLinks">
        <button class="nav__link is-active" type="button" data-nav="首页">首页</button>
        <button class="nav__link" type="button" data-nav="商品">商品</button>
        <button class="nav__link" type="button" data-nav="新品">新品</button>
        <button class="nav__link" type="button" data-nav="CPhone">CPhone</button>
        <button class="nav__link" type="button" data-nav="CPad">CPad</button>
        <button class="nav__link" type="button" data-nav="CBook">CBook</button>
        <button class="nav__link" type="button" data-nav="配件">配件</button>
      </nav>

      <div class="nav__tools">
        <button class="icon-btn" type="button" id="cartBtn" aria-label="购物车">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-btn__svg">
            <use href="#art-bag" />
          </svg>
          <span class="icon-btn__badge" id="cartBadge" hidden>0</span>
        </button>

        <div class="user">
          <button class="user__btn" type="button" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-label="账户菜单">
            <img class="user__avatar" id="navAvatar" src="assets/avatars/avatar-male.png" alt="" />
          </button>
          <div class="user__menu" id="userMenu" hidden>
            <div class="user__info">
              <img class="user__avatar user__avatar--lg" id="menuAvatar" src="assets/avatars/avatar-male.png" alt="" />
              <div>
                <p class="user__name" id="menuName">用户</p>
                <p class="user__account" id="menuAccount"></p>
              </div>
            </div>
            <button class="user__logout" type="button" id="logoutBtn">退出登录</button>
          </div>
        </div>

        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <input
            class="search__input"
            id="searchInput"
            type="search"
            placeholder="搜索商品、型号或关键词"
            aria-label="搜索商品"
          />
          <button class="search__clear" type="button" id="searchClear" aria-label="清除搜索" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>

          <div class="search__panel" id="searchPanel" hidden>
            <p class="search__hint" id="searchHint">热门搜索</p>
            <div class="search__list" id="searchList"></div>
          </div>
        </form>
      </div>
    </div>

    <!-- 悬停展开的下拉面板 -->
    <div class="nav-menu" id="navMenu" aria-hidden="true">
      <div class="nav-menu__inner">
        <div class="nav-menu__body" id="navMenuBody"></div>
      </div>
    </div>
  </header>

  <!-- 下拉时页面内容虚化层 -->
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <main>
    <!-- ==================== 主视觉 ==================== -->
    <section class="hero">
      <div class="hero__inner">
        <div class="hero__copy">
          <p class="eyebrow">
            <span class="eyebrow__brand">CSHOP</span>
            <span class="eyebrow__year">2026</span>
            <span class="eyebrow__dot" aria-hidden="true"></span>
            <span class="eyebrow__season">新品季</span>
          </p>
          <h1 class="hero__title">让算力在指尖折叠</h1>
          <p class="hero__lede">
            从 CBook 的创作力，到 CPhone 的影像力，<br class="hero__br" />
            一套为日常而生的设备体系。
          </p>
          <div class="hero__actions">
            <button class="btn-ink" type="button" id="heroExplore">探索新品</button>
            <button class="btn-quiet" type="button" id="heroLearn">
              了解 CBook
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </div>

        <div class="hero__visual" aria-hidden="true">
          <span class="hero__glow"></span>
          <span class="hero__ring"></span>
          <svg class="hero__art hero__art--laptop" viewBox="0 0 320 220"><use href="#art-laptop" /></svg>
          <svg class="hero__art hero__art--phone" viewBox="0 0 320 220"><use href="#art-phone" /></svg>
          <span class="hero__caption">CBook Air X ／ CPhone 21 Pro Max</span>
        </div>
      </div>
    </section>

    <!-- ==================== 分类入口 ==================== -->
    <section class="section">
      <div class="section__head">
        <div>
          <h2 class="section__title">新品探寻</h2>
          <p class="section__sub">崭新生活，覆盖移动、创作与随身配件</p>
        </div>
        <a class="link-more" href="products.html">
          全部新品
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </a>
      </div>

      <div class="product-grid" id="newGrid"></div>
    </section>

    <!-- ==================== 精选产品 ==================== -->
    <section class="section">
      <div class="section__head">
        <div>
          <h2 class="section__title">精选产品</h2>
          <p class="section__sub">每一件都值得放进日常</p>
        </div>
        <button class="link-more" type="button" id="viewAll">
          查看全部
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>

      <div class="product-grid" id="featuredGrid"></div>
    </section>

    <!-- ==================== 商品列表 ==================== -->
  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <p class="footer__logo">CSHOP</p>
        <p class="footer__slogan">让算力在指尖折叠</p>
      </div>

      <ul class="footer__list">
        <li>顺丰包邮 · 全场免运费</li>
        <li>7 天无理由退换</li>
        <li>一年官方质保</li>
      </ul>

      <p class="footer__copy">© 2026 CSHOP · 演示项目，仅用于课程展示</p>
    </div>
  </footer>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js?v=118"></script>
  <script src="js/products.js?v=118"></script>
  <script src="js/cart.js?v=118"></script>
  <script src="js/nav.js?v=118"></script>
  <script src="js/home.js?v=118"></script>
</body>
</html>
