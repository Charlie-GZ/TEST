<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CSHOP">
  <defs>
    <linearGradient id="cshop-top" x1="8" y1="5" x2="55" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8D3FF"/>
      <stop offset="0.55" stop-color="#74ABF3"/>
      <stop offset="1" stop-color="#4884E5"/>
    </linearGradient>
    <linearGradient id="cshop-left" x1="9" y1="21" x2="33" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E82EE"/>
      <stop offset="1" stop-color="#1A46B4"/>
    </linearGradient>
    <linearGradient id="cshop-right" x1="55" y1="21" x2="31" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E5CEC"/>
      <stop offset="1" stop-color="#2B199B"/>
    </linearGradient>
  </defs>

  <!-- 立方体三个面 -->
  <polygon points="32,5 56,19 32,33 8,19" fill="url(#cshop-top)"/>
  <polygon points="8,19 32,33 32,58 8,44" fill="url(#cshop-left)"/>
  <polygon points="56,19 32,33 32,58 56,44" fill="url(#cshop-right)"/>

  <!-- 顶面高光与棱线，增加立体感 -->
  <polygon points="32,9 51,20 32,31 13,20" fill="#ffffff" opacity="0.18"/>
  <path d="M8 19L32 33L56 19" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- 左面上的白色 C -->
  <path d="M25.9 31.9A7.6 7.6 0 1 0 25.9 42.3" fill="none" stroke="#ffffff" stroke-width="3.7" stroke-linecap="round"/>
</svg>
