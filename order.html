<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>下单成功 · CSHOP</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=148" />
  <link rel="stylesheet" href="css/cart.css?v=148" />
  <link rel="stylesheet" href="css/home.css?v=152" />
  <link rel="stylesheet" href="css/checkout.css?v=149" />
  <link rel="stylesheet" href="css/assistant.css?v=4" />
</head>
<body class="home" data-page="order">

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="art-bag" viewBox="0 0 24 24">
      <path d="M6.5 8h11l1 12h-13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M9.2 8V6.4a2.8 2.8 0 0 1 5.6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol>
  </svg>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <span class="nav__logo" aria-label="CSHOP">CSHOP</span>

      <nav class="nav__links" aria-label="商品分类" id="navLinks">
        <button class="nav__link" type="button" data-nav="首页">首页</button>
        <button class="nav__link" type="button" data-nav="商品">商品</button>
        <button class="nav__link" type="button" data-nav="新品">新品</button>
        <button class="nav__link" type="button" data-nav="CPhone">CPhone</button>
        <button class="nav__link" type="button" data-nav="CPad">CPad</button>
        <button class="nav__link" type="button" data-nav="CBook">CBook</button>
        <button class="nav__link" type="button" data-nav="配件">配件</button>
      </nav>

      <div class="nav__tools">
        <button class="icon-btn" type="button" id="cartBtn" aria-label="购物车">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-btn__svg">
            <use href="#art-bag" />
          </svg>
          <span class="icon-btn__badge" id="cartBadge" hidden>0</span>
        </button>

        <div class="user">
          <button class="user__btn" type="button" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-label="账户菜单">
            <img class="user__avatar" id="navAvatar" src="assets/avatars/avatar-male.png" alt="" />
          </button>
          <div class="user__menu" id="userMenu" hidden>
            <div class="user__info">
              <img class="user__avatar user__avatar--lg" id="menuAvatar" src="assets/avatars/avatar-male.png" alt="" />
              <div>
                <p class="user__name" id="menuName">用户</p>
                <p class="user__account" id="menuAccount"></p>
              </div>
            </div>
            <button class="user__logout" type="button" id="logoutBtn">退出登录</button>
          </div>
        </div>

        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <input class="search__input" id="searchInput" type="search" placeholder="搜索商品、型号或关键词" aria-label="搜索商品" />
          <button class="search__clear" type="button" id="searchClear" aria-label="清除搜索" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>
          <div class="search__panel" id="searchPanel" hidden>
            <p class="search__hint" id="searchHint">热门搜索</p>
            <div class="search__list" id="searchList"></div>
          </div>
        </form>
      </div>
    </div>

    <div class="nav-menu" id="navMenu" aria-hidden="true">
      <div class="nav-menu__inner">
        <div class="nav-menu__body" id="navMenuBody"></div>
      </div>
    </div>
  </header>

  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <main class="ok">
    <span class="ok__badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="m5.5 12.4 4.2 4.2 8.8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>

    <h1 class="ok__title">下单成功</h1>
    <p class="ok__sub" id="okSub">我们已经收到你的订单，正在准备发货</p>

    <section class="ok__card" id="okCard" hidden>
      <dl class="ok__rows">
        <div class="ok__row"><dt>订单号</dt><dd id="okId">—</dd></div>
        <div class="ok__row"><dt>下单时间</dt><dd id="okTime">—</dd></div>
        <div class="ok__row"><dt>实付金额</dt><dd><strong id="okTotal">—</strong></dd></div>
        <div class="ok__row"><dt>支付方式</dt><dd id="okPay">—</dd></div>
        <div class="ok__row"><dt>收货信息</dt><dd id="okAddr">—</dd></div>
        <div class="ok__row" id="okNoteRow" hidden><dt>备注</dt><dd id="okNote"></dd></div>
      </dl>

      <div class="ok__items" id="okItems"></div>
    </section>

    <div class="ok__actions">
      <a class="ok__btn ok__btn--primary" href="products.html">继续购物</a>
      <a class="ok__btn" href="index.html?v=148">返回首页</a>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js?v=148"></script>
  <script src="js/products.js?v=149"></script>
  <script src="js/cart.js?v=148"></script>
  <script src="js/nav.js?v=150"></script>
  <script src="js/orders.js?v=148"></script>
  <script src="js/order.js?v=149"></script>
  <script src="js/ai-endpoint.js?v=1"></script>
  <script src="js/assistant-tools.js?v=4"></script>
  <script src="js/assistant.js?v=4"></script>
</body>
</html>
