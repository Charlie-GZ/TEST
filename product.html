<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>CPhone ING · CSHOP</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=148" />
  <link rel="stylesheet" href="css/cart.css?v=148" />
  <link rel="stylesheet" href="css/home.css?v=152" />
  <link rel="stylesheet" href="css/product.css?v=148" />
  <link rel="stylesheet" href="css/assistant.css?v=4" />
</head>
<body class="home" data-page="product">

  <!-- 导航需要的图标 -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="art-bag" viewBox="0 0 24 24">
      <path d="M6.5 8h11l1 12h-13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M9.2 8V6.4a2.8 2.8 0 0 1 5.6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol>
  </svg>

  <!-- ==================== 顶部导航 ==================== -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <span class="nav__logo" aria-label="CSHOP">CSHOP</span>

      <nav class="nav__links" aria-label="商品分类" id="navLinks">
        <button class="nav__link" type="button" data-nav="首页">首页</button>
        <button class="nav__link" type="button" data-nav="商品">商品</button>
        <button class="nav__link" type="button" data-nav="新品">新品</button>
        <button class="nav__link is-active" type="button" data-nav="CPhone">CPhone</button>
        <button class="nav__link" type="button" data-nav="CPad">CPad</button>
        <button class="nav__link" type="button" data-nav="CBook">CBook</button>
        <button class="nav__link" type="button" data-nav="配件">配件</button>
      </nav>

      <div class="nav__tools">
        <button class="icon-btn" type="button" id="cartBtn" aria-label="购物车">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-btn__svg">
            <use href="#art-bag" />
          </svg>
          <span class="icon-btn__badge" id="cartBadge" hidden>0</span>
        </button>

        <div class="user">
          <button class="user__btn" type="button" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-label="账户菜单">
            <img class="user__avatar" id="navAvatar" src="assets/avatars/avatar-male.png" alt="" />
          </button>
          <div class="user__menu" id="userMenu" hidden>
            <div class="user__info">
              <img class="user__avatar user__avatar--lg" id="menuAvatar" src="assets/avatars/avatar-male.png" alt="" />
              <div>
                <p class="user__name" id="menuName">用户</p>
                <p class="user__account" id="menuAccount"></p>
              </div>
            </div>
            <button class="user__logout" type="button" id="logoutBtn">退出登录</button>
          </div>
        </div>

        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <input class="search__input" id="searchInput" type="search" placeholder="搜索商品、型号或关键词" aria-label="搜索商品" />
          <button class="search__clear" type="button" id="searchClear" aria-label="清除搜索" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>
        </form>
      </div>
    </div>

    <div class="nav-menu" id="navMenu" aria-hidden="true">
      <div class="nav-menu__inner">
        <div class="nav-menu__body" id="navMenuBody"></div>
      </div>
    </div>
  </header>

  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <main class="pd">
    <!-- 面包屑 -->
    <nav class="pd__crumb" id="pdCrumb" aria-label="面包屑">
      <a href="products.html">商店</a>
      <span class="pd__crumb-sep" aria-hidden="true">/</span>
      <a href="products.html?cat=cphone" id="pdCrumbCat">手机</a>
      <span class="pd__crumb-sep" aria-hidden="true">/</span>
      <span aria-current="page" id="pdCrumbName">CPhone ING</span>
    </nav>

    <div class="pd__grid">
      <!-- 左：图库 -->
      <div class="pd-gallery">
        <div class="pd-gallery__frame">
          <div class="pd-gallery__stage" id="pdStage"></div>
          <span class="pd-gallery__badge" id="pdBadge" hidden>新品</span>
        </div>
        <div class="pd-gallery__thumbs" id="pdThumbs" role="tablist" aria-label="商品图片"></div>
      </div>

      <!-- 右：信息 -->
      <section class="pd-info" aria-label="商品信息">
        <h1 class="pd-info__title" id="pdName">CPhone ING</h1>

        <div class="pd-info__price-row">
          <p class="pd-info__price" id="pdPrice">¥5,999</p>
          <p class="pd-info__price-note">含税 · 免运费</p>
        </div>

        <div class="pd-info__chips" id="pdChips"></div>

        <p class="pd-stock" id="pdStock">现货 · 可立即发货</p>

        <p class="pd-info__desc" id="pdDesc"></p>

        <hr class="pd-divider" />

        <div class="pd-field">
          <p class="pd-field__label">颜色：<span class="pd-field__value" id="pdColorName">冰海蓝</span></p>
          <div class="pd-swatches" id="pdSwatches"></div>
        </div>

        <div class="pd-field">
          <p class="pd-field__label">数量</p>
          <div class="pd-qty">
            <button class="pd-qty__btn" type="button" data-step="-1" aria-label="减少数量">−</button>
            <span class="pd-qty__value" id="pdQty" aria-live="polite">1</span>
            <button class="pd-qty__btn" type="button" data-step="1" aria-label="增加数量">+</button>
          </div>
        </div>

        <div class="pd-actions">
          <button class="pd-btn pd-btn--cart" type="button" id="pdAdd">加入购物车</button>
          <button class="pd-btn pd-btn--buy" type="button" id="pdBuy">立即下单</button>
        </div>

        <p class="pd-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v8H3z" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M14 10h4l3 3v2h-7z" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="7" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="17.5" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
          今日 18:00 前下单，预计明日送达
        </p>

        <div class="pd-acc" id="pdAcc"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <p class="footer__logo">CSHOP</p>
        <p class="footer__slogan">让算力在指尖折叠</p>
      </div>

      <ul class="footer__list">
        <li>顺丰包邮 · 全场免运费</li>
        <li>7 天无理由退换</li>
        <li>一年官方质保</li>
      </ul>

      <p class="footer__copy">© 2026 CSHOP · 演示项目，仅用于课程展示</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js?v=148"></script>
  <script src="js/products.js?v=149"></script>
  <script src="js/cart.js?v=148"></script>
  <script src="js/orders.js?v=148"></script>
  <script src="js/nav.js?v=150"></script>
  <script src="js/product-detail.js?v=150"></script>
  <script src="js/ai-endpoint.js?v=1"></script>
  <script src="js/assistant-tools.js?v=4"></script>
  <script src="js/assistant.js?v=4"></script>
</body>
</html>
